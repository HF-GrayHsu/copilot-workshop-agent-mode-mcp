<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">每日計畫</p>
      <h1>我的待辦清單</h1>
      <p class="subtitle">一步一步，完成今天的重要事項。</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼？"
        maxlength="200"
        required
      >
      <button class="btn-add" type="submit">新增</button>
    </form>

    <section class="list-section" aria-label="待辦事項">
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>
    </section>

    <footer class="app-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
    </footer>
  </main>
</body>
</html>
