<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f5f7">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">每日計畫</p>
      <div class="title-row">
        <h1>我的待辦清單</h1>
        <button id="theme-toggle" class="btn-theme" type="button" aria-pressed="false">
          🌙 深色模式
        </button>
      </div>
      <p class="subtitle">一步一步，完成今天的重要事項。</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼？"
        maxlength="200"
        required
      >
      <button class="btn-add" type="submit">新增</button>
    </form>

    <nav id="todo-filters" class="filter-bar" aria-label="篩選待辦事項">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">
        全部
      </button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">
        未完成
      </button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
        已完成
      </button>
    </nav>

    <section class="list-section" aria-label="待辦事項">
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden></p>
    </section>

    <footer class="app-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
      <button
        id="clear-completed"
        class="btn-clear-completed"
        type="button"
        aria-label="清除所有已完成的待辦事項"
        disabled
      >
        清除已完成
      </button>
    </footer>
  </main>
</body>
</html>
